[package]
name = "quickxml_shim"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib: the .so ccall'd from Julia. rlib: lets tests/smoke.rs link the same
# code in-process for verification without going through the C ABI/dlopen.
crate-type = ["cdylib", "rlib"]

[dependencies]
quick-xml = "0.36"

[profile.release]
# Benchmark shim only: a panic crossing the FFI boundary into Julia is UB.
# abort turns any bug into a hard crash instead, which is safe (if blunt).
panic = "abort"
